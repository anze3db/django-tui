[project]
name = "django-tui"
# CalVer: YY.N = the Nth release of 20YY (26.1, 26.2, ..., 27.1). Bumped by scripts/release.py.
version = "24.5"
description = "Inspect and run Django Commands in a text-based user interface (TUI)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["django", "tui", "textual"]
authors = [{ name = "Anže Pečar", email = "anze@pecar.me" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["django>=5.2", "textual>=6.0"]

[project.urls]
Documentation = "https://github.com/anze3db/django-tui#readme"
Issues = "https://github.com/anze3db/django-tui/issues"
Source = "https://github.com/anze3db/django-tui"
Changelog = "https://github.com/anze3db/django-tui/blob/main/CHANGELOG.md"
Mastodon = "https://fosstodon.org/@anze3db"
Twitter = "https://twitter.com/anze3db"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  # Running a command exits a headless test app before the command line's suggestion is looked up
  "ignore:coroutine 'Suggester._get_suggestion' was never awaited:RuntimeWarning",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
  "RUF012",  # Textual's BINDINGS are class attributes by design
  "BLE001",  # The TUI catches whatever a project's commands raise, so that it keeps running
]

[tool.ruff.lint.isort]
known-first-party = ["django_tui"]
